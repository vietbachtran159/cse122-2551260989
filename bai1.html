<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài thơ Bốn Mùa</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      
      align-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: #ffffff;
    }
    .poem {
      box-sizing: border-box;
      width: 640px;
      max-width: 100%;
      padding: 24px;
      background: #FFFDE7;
      border: 1px solid #9E9E9E;
      text-align: center;
    }
    .poem h1 {
      margin: 0 0 20px;
      padding: 6px 0;
      font-size: 26px;
      font-weight: bold;
      text-transform: uppercase;
      color: #D40000;
      background: #FFD9E6;
      text-align: center;
    }
    .poem p {
      margin: 0;
      font-style: italic;
      line-height: 1.7;
      font-size: 18px;
      color: #0033CC;
    }
    .poem p.red {
      color: #D40000;
    }
    .poem hr {
      width: 55%;
      height: 0;
      margin: 16px auto;
      border: 0;
      border-top: 2px solid #0033CC;
    }
  </style>
</head>
<body>
  <article class="poem">
    <h1>BỐN MÙA</h1>

    <p>
      Xuân về hoa nở khắp trời<br>
      Hạ sang nắng cháy rạng ngời phố quen<br>
      Thu về lá rụng bên thềm
    </p>

    <hr>

    <p class="red">
      Đông sang gió lạnh bên em đợi chờ<br>
      Bốn mùa là bốn giấc mơ<br>
      Thời gian đi mãi ta chờ đợi ai
    </p>

    <hr>

    <p>
      Một năm rồi lại một năm<br>
      Vẫn còn câu hát thì thầm quê hương<br>
      Chờ xuân nắng mới soi đường
    </p>
  </article>
</body>
</html>
