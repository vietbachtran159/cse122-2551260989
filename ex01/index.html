<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bốn Mùa</title>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .khung {
      width: 640px;
      padding: 24px;
      background: #FFFDE7;
      border: 1px solid #9E9E9E;
      text-align: center;
    }
    h1 {
      margin: 0 0 20px;
      padding: 6px 0;
      font-size: 26px;
      color: #D40000;
      background: #FFD9E6;
    }
    p {
      font-style: italic;
      line-height: 1.7;
      color: #0033CC;
    }
    .do {
      color: #D40000;
    }
    hr {
      width: 55%;
      border: 1px solid #0033CC;
    }
  </style>
</head>
<body>
  <div class="khung">
    <h1>BỐN MÙA</h1>

    <p>
      Xuân về hoa nở khắp trời<br>
      Hạ sang nắng cháy rạng ngời phố quen<br>
      Thu về lá rụng bên thềm
    </p>

    <hr>

    <p class="do">
      Đông sang gió lạnh bên em đợi chờ<br>
      Bốn mùa là bốn giấc mơ<br>
      Thời gian đi mãi ta chờ đợi ai
    </p>

    <hr>

    <p>
      Một năm rồi lại một năm<br>
      Vẫn còn câu hát thì thầm quê hương<br>
      Chờ xuân nắng mới soi đường
    </p>
  </div>
</body>
</html>
